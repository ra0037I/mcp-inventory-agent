# Own LiteLLM proxy in front of OpenAI (and optionally a local Ollama model)
#   pip install "litellm[proxy]"
#   start it from the project folder - LiteLLM reads OPENAI_API_KEY + LITELLM_MASTER_KEY from .env
#   litellm --config litellm_config.yaml --port 4000
# then in .env:  LLM_PROVIDER=litellm, LITELLM_API_BASE=http://localhost:4000,
#                LITELLM_KEY=<same value as LITELLM_MASTER_KEY>, LITELLM_DEFAULT_MODEL=gpt-4o-mini
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY    # read from the environment variable OPENAI_API_KEY
  - model_name: qwen2.5                     # optional: local model via Ollama
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://localhost:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # set in .env (LiteLLM refuses known defaults like sk-1234)
